name: Defense site external monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: defense-site-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public critical pages and contact links
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C.UTF-8
          site="https://defense.shichilawfirm.com"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          fetch() {
            local path="$1" output="$2" url="${site}${path}" meta status final
            meta="$(curl --fail --silent --show-error --location --retry 2 --retry-all-errors --max-time 30 \
              -H 'Cache-Control: no-cache' -A 'ShichiCloudMonitor/1.0' \
              -o "$output" -w '%{http_code} %{url_effective}' "$url")"
            read -r status final <<<"$meta"
            [[ "$status" == "200" ]]
            [[ "${final%/}" == "${url%/}" ]]
          }

          check_page() {
            local path="$1" marker="$2" file="$work/page.html"
            fetch "$path" "$file"
            grep -Fq '時起法律事務所' "$file"
            [[ -z "$marker" ]] || grep -Fq "$marker" "$file"
            grep -Eq '<h1([ >])' "$file"
            grep -Fq 'tel:+886-4-22294866' "$file"
            grep -Fq 'tel:+886-909-579-081' "$file"
            grep -Fq 'https://line.me/R/ti/p/@629xmmsh' "$file"
          }

          check_page / ''
          check_page /criminal-defense/mule-account/ '人頭帳戶'
          check_page /criminal-defense/fraud/ '詐欺'
          check_page /contact/ '聯絡'
          check_page /lawyers/zhang-rong-cheng/ '張榮成'

          fetch /sitemap.xml "$work/sitemap.xml"
          for path in / /criminal-defense/mule-account/ /criminal-defense/fraud/ /contact/ /lawyers/zhang-rong-cheng/; do
            grep -Fq "<loc>${site}${path}</loc>" "$work/sitemap.xml"
          done
          fetch /robots.txt "$work/robots.txt"
          grep -Fq "Sitemap: ${site}/sitemap.xml" "$work/robots.txt"
          ! grep -Eiq '^Disallow:[[:space:]]*/[[:space:]]*$' "$work/robots.txt"
      - name: Open one alert issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 defense.shichilawfirm.com 外部監控異常';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open'
            });
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title,
                body: `GitHub 雳端監控無法通過官網關鍵頁或聯絡方式檢查。\n\n執行紀錄：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
      - name: Close alert issue after recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 defense.shichilawfirm.com 外部監控異常';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open'
            });
            for (const issue of issues.filter(item => item.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: '✅ 外部監控已再次通過，系統自動關閉此警示。'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed'
              });
            }
